[package]
name = "rwa-token-aggregator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
compliance-aggregator = { path = "../../contracts/compliance-aggregator" }
denylist-gate = { path = "../../contracts/denylist-gate" }
jurisdiction-flag = { path = "../../contracts/jurisdiction-flag" }

[features]
testutils = ["soroban-sdk/testutils"]
